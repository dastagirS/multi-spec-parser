name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    strategy:
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      # Battle fixtures are git-ignored (~22MB of re-fetchable upstream specs);
      # download once before the test gate.
      - name: Fetch battle fixtures
        run: npm run fixtures

      - name: Test gate (build + unit tests + battle suite)
        run: npm run check

      # Sanity: the tarball must be exactly what ships (dist/src + examples).
      - name: Verify publishable tarball
        run: npm pack --dry-run

      - name: Build current native prebuild
        run: npm run native:prebuild

      - name: Verify installable package
        run: |
          package_file="$(npm pack --silent --pack-destination "$RUNNER_TEMP")"
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')" \
            node scripts/verify-package.mjs "$RUNNER_TEMP/$package_file" "linux-x64"
